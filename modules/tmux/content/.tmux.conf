bind r source-file ~/.tmux.conf \; display "Reloaded!"

set -ga terminal-overrides ",*:Tc"
set-option -g default-terminal "tmux-256color"

set -g mode-keys vi # copy mode using VIM
set -g status-keys vi # status-keys sets the key bindings for the command prompt.

set -g mouse on # set mouse to be available
set -g focus-events on # forward terminal focus events to programs like nvim (needed for autoread)

set -g base-index 1 # index windows using 1-indexing
setw -g pane-base-index 1 # index panes using 1-indexing
set -g renumber-windows on # renumber windows when a window is closed

# Use Prefix + HJKL to switch panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Prefix + HJKL (held or repeated)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g status-left-length 50
set -g status-left "[#S] "
set -g window-status-current-format " #I:#W* "
set -g window-status-format " #I:#W "
